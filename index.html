<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Game Application</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #312e81);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        /* Main Container */

        .quiz-container {
            width: 100%;
            max-width: 750px;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(15px);
        }

        /* Header */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .title {
            font-size: 30px;
            font-weight: bold;
        }

        .timer {
            background: #ef4444;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        /* Progress */

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #06b6d4, #8b5cf6);
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        /* Question */

        .question-number {
            color: #06b6d4;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question {
            font-size: 25px;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        /* Options */

        .options {
            display: grid;
            gap: 14px;
        }

        .option {
            width: 100%;
            padding: 17px 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid transparent;
            border-radius: 14px;
            color: white;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateX(4px);
        }

        .option.selected {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.2);
        }

        .option.correct {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.2);
        }

        .option.wrong {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }

        .option:disabled {
            cursor: default;
        }

        /* Buttons */

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .nav-btn {
            padding: 13px 25px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.3s;
        }

        .previous-btn {
            background: #475569;
        }

        .next-btn {
            background: #6366f1;
            margin-left: auto;
        }

        .submit-btn {
            background: #10b981;
            margin-left: auto;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Message */

        .message {
            min-height: 25px;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #fbbf24;
        }

        /* Result Screen */

        .result-screen {
            display: none;
            text-align: center;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .score {
            font-size: 60px;
            font-weight: bold;
            color: #10b981;
            margin: 20px 0;
        }

        .result-message {
            color: #cbd5e1;
            font-size: 17px;
            margin-bottom: 25px;
        }

        .restart-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        /* Score Details */

        .score-details {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .detail-box {
            min-width: 120px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
        }

        .detail-number {
            display: block;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .detail-label {
            color: #94a3b8;
            font-size: 13px;
        }

        /* Start Screen */

        .start-screen {
            text-align: center;
        }

        .quiz-icon {
            font-size: 80px;
            margin-bottom: 15px;
        }

        .start-title {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .start-description {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .start-btn {
            border: none;
            background: #6366f1;
            color: white;
            padding: 15px 35px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        .quiz-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.07);
            padding: 10px 15px;
            border-radius: 10px;
            color: #cbd5e1;
            font-size: 13px;
        }

        /* Responsive */

        @media (max-width: 600px) {

            .quiz-card {
                padding: 20px;
            }

            .header {
                align-items: flex-start;
                gap: 10px;
            }

            .title {
                font-size: 24px;
            }

            .timer {
                font-size: 14px;
                padding: 8px 12px;
            }

            .question {
                font-size: 20px;
            }

            .option {
                padding: 14px;
            }

            .score {
                font-size: 50px;
            }

            .result-title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <div class="quiz-card">

        <!-- ============================= -->
        <!-- START SCREEN -->
        <!-- ============================= -->

        <div class="start-screen" id="startScreen">

            <div class="quiz-icon">
                🧠
            </div>

            <h1 class="start-title">
                Quiz Game
            </h1>

            <p class="start-description">
                Test your knowledge with this interactive
                multiple-choice quiz.
            </p>

            <div class="quiz-info">

                <div class="info-item">
                    📝 10 Questions
                </div>

                <div class="info-item">
                    ⏱️ 60 Seconds
                </div>

                <div class="info-item">
                    🎯 Instant Score
                </div>

            </div>

            <button
                class="start-btn"
                id="startButton">
                Start Quiz
            </button>

        </div>


        <!-- ============================= -->
        <!-- QUIZ SCREEN -->
        <!-- ============================= -->

        <div id="quizScreen" style="display:none;">

            <div class="header">

                <div class="title">
                    🧠 Quiz Game
                </div>

                <div class="timer" id="timer">
                    ⏱️ 60
                </div>

            </div>


            <!-- Progress -->

            <div class="progress-info">

                <span id="questionCounter">
                    Question 1 of 10
                </span>

                <span id="scoreDisplay">
                    Score: 0
                </span>

            </div>

            <div class="progress-bar">

                <div
                    class="progress"
                    id="progress">
                </div>

            </div>


            <!-- Question -->

            <div
                class="question-number"
                id="questionNumber">
                Question 1
            </div>

            <div
                class="question"
                id="question">
            </div>


            <!-- Options -->

            <div
                class="options"
                id="options">
            </div>


            <!-- Message -->

            <div
                class="message"
                id="message">
            </div>


            <!-- Navigation -->

            <div class="navigation">

                <button
                    class="nav-btn previous-btn"
                    id="previousButton">
                    ← Previous
                </button>

                <button
                    class="nav-btn next-btn"
                    id="nextButton">
                    Next →
                </button>

                <button
                    class="nav-btn submit-btn"
                    id="submitButton"
                    style="display:none;">
                    Submit Quiz ✓
                </button>

            </div>

        </div>


        <!-- ============================= -->
        <!-- RESULT SCREEN -->
        <!-- ============================= -->

        <div
            class="result-screen"
            id="resultScreen">

            <div class="result-icon">
                🏆
            </div>

            <h1 class="result-title">
                Quiz Completed!
            </h1>

            <p>
                Your Final Score
            </p>

            <div
                class="score"
                id="finalScore">
                0 / 10
            </div>


            <div class="score-details">

                <div class="detail-box">

                    <span
                        class="detail-number"
                        id="correctAnswers">
                        0
                    </span>

                    <span class="detail-label">
                        Correct
                    </span>

                </div>


                <div class="detail-box">

                    <span
                        class="detail-number"
                        id="wrongAnswers">
                        0
                    </span>

                    <span class="detail-label">
                        Wrong
                    </span>

                </div>


                <div class="detail-box">

                    <span
                        class="detail-number"
                        id="percentage">
                        0%
                    </span>

                    <span class="detail-label">
                        Percentage
                    </span>

                </div>

            </div>


            <p
                class="result-message"
                id="resultMessage">
            </p>


            <button
                class="restart-btn"
                id="restartButton">
                🔄 Play Again
            </button>

        </div>

    </div>

</div>


<script>

    // ==========================================
    // QUIZ QUESTIONS
    // ==========================================

    const questions = [

        {
            question: "What does HTML stand for?",
            options: [
                "Hyper Text Markup Language",
                "High Text Machine Language",
                "Hyperlink Text Management Language",
                "Home Tool Markup Language"
            ],
            answer: 0
        },

        {
            question: "Which language is used to style web pages?",
            options: [
                "HTML",
                "CSS",
                "Python",
                "Java"
            ],
            answer: 1
        },

        {
            question: "Which language is mainly used for web page interactivity?",
            options: [
                "HTML",
                "CSS",
                "JavaScript",
                "SQL"
            ],
            answer: 2
        },

        {
            question: "Which symbol is used for an ID selector in CSS?",
            options: [
                ".",
                "#",
                "*",
                "@"
            ],
            answer: 1
        },

        {
            question: "Which tag is used to create a hyperlink in HTML?",
            options: [
                "<link>",
                "<href>",
                "<a>",
                "<url>"
            ],
            answer: 2
        },

        {
            question: "Which company developed JavaScript?",
            options: [
                "Microsoft",
                "Netscape",
                "Google",
                "Apple"
            ],
            answer: 1
        },

        {
            question: "Which HTML tag is used to display an image?",
            options: [
                "<picture>",
                "<image>",
                "<img>",
                "<src>"
            ],
            answer: 2
        },

        {
            question: "Which CSS property is used to change text color?",
            options: [
                "font-color",
                "text-color",
                "color",
                "foreground"
            ],
            answer: 2
        },

        {
            question: "Which keyword is used to declare a variable in JavaScript?",
            options: [
                "variable",
                "var",
                "int",
                "string"
            ],
            answer: 1
        },

        {
            question: "Which method is used to print something in the browser console?",
            options: [
                "console.log()",
                "print()",
                "display()",
                "write.log()"
            ],
            answer: 0
        }

    ];


    // ==========================================
    // VARIABLES
    // ==========================================

    let currentQuestion = 0;

    let score = 0;

    let userAnswers = new Array(questions.length)
        .fill(null);

    let quizStarted = false;

    let timeLeft = 60;

    let timerInterval;


    // ==========================================
    // DOM ELEMENTS
    // ==========================================

    const startScreen =
        document.getElementById("startScreen");

    const quizScreen =
        document.getElementById("quizScreen");

    const resultScreen =
        document.getElementById("resultScreen");

    const startButton =
        document.getElementById("startButton");

    const restartButton =
        document.getElementById("restartButton");

    const question =
        document.getElementById("question");

    const options =
        document.getElementById("options");

    const questionNumber =
        document.getElementById("questionNumber");

    const questionCounter =
        document.getElementById("questionCounter");

    const scoreDisplay =
        document.getElementById("scoreDisplay");

    const progress =
        document.getElementById("progress");

    const timer =
        document.getElementById("timer");

    const previousButton =
        document.getElementById("previousButton");

    const nextButton =
        document.getElementById("nextButton");

    const submitButton =
        document.getElementById("submitButton");

    const message =
        document.getElementById("message");

    const finalScore =
        document.getElementById("finalScore");

    const correctAnswers =
        document.getElementById("correctAnswers");

    const wrongAnswers =
        document.getElementById("wrongAnswers");

    const percentage =
        document.getElementById("percentage");

    const resultMessage =
        document.getElementById("resultMessage");


    // ==========================================
    // START QUIZ
    // ==========================================

    startButton.addEventListener(
        "click",
        startQuiz
    );


    function startQuiz() {

        startScreen.style.display = "none";

        quizScreen.style.display = "block";

        resultScreen.style.display = "none";

        quizStarted = true;

        currentQuestion = 0;

        score = 0;

        userAnswers =
            new Array(questions.length).fill(null);

        timeLeft = 60;

        updateTimer();

        startTimer();

        loadQuestion();

    }


    // ==========================================
    // LOAD QUESTION
    // ==========================================

    function loadQuestion() {

        const current =
            questions[currentQuestion];


        questionNumber.textContent =
            `Question ${currentQuestion + 1}`;


        questionCounter.textContent =
            `Question ${currentQuestion + 1} of ${questions.length}`;


        question.textContent =
            current.question;


        scoreDisplay.textContent =
            `Score: ${score}`;


        // Progress bar

        const progressValue =
            ((currentQuestion + 1) /
                questions.length) * 100;

        progress.style.width =
            progressValue + "%";


        // Clear old options

        options.innerHTML = "";

        message.textContent = "";


        // Create options

        current.options.forEach(
            (optionText, index) => {

                const button =
                    document.createElement("button");

                button.className = "option";

                button.textContent =
                    `${String.fromCharCode(65 + index)}. ${optionText}`;


                button.addEventListener(
                    "click",
                    () => selectAnswer(index)
                );


                // Show previously selected answer

                if (
                    userAnswers[currentQuestion] === index
                ) {

                    button.classList.add("selected");

                }


                options.appendChild(button);

            }
        );


        // Previous button

        if (currentQuestion === 0) {

            previousButton.disabled = true;

        } else {

            previousButton.disabled = false;

        }


        // Last question

        if (
            currentQuestion === questions.length - 1
        ) {

            nextButton.style.display = "none";

            submitButton.style.display =
                "block";

        } else {

            nextButton.style.display = "block";

            submitButton.style.display =
                "none";

        }

    }


    // ==========================================
    // SELECT ANSWER
    // ==========================================

    function selectAnswer(selectedIndex) {

        userAnswers[currentQuestion] =
            selectedIndex;


        const optionButtons =
            document.querySelectorAll(".option");


        optionButtons.forEach(
            (button, index) => {

                button.classList.remove(
                    "selected"
                );

                if (index === selectedIndex) {

                    button.classList.add(
                        "selected"
                    );

                }

            }
        );


        message.textContent =
            "Answer selected ✓";

    }


    // ==========================================
    // NEXT QUESTION
    // ==========================================

    nextButton.addEventListener(
        "click",
        function() {

            if (
                userAnswers[currentQuestion] === null
            ) {

                message.textContent =
                    "Please select an answer first.";

                return;

            }


            if (
                currentQuestion <
                questions.length - 1
            ) {

                currentQuestion++;

                loadQuestion();

            }

        }
    );


    // ==========================================
    // PREVIOUS QUESTION
    // ==========================================

    previousButton.addEventListener(
        "click",
        function() {

            if (currentQuestion > 0) {

                currentQuestion--;

                loadQuestion();

            }

        }
    );


    // ==========================================
    // SUBMIT QUIZ
    // ==========================================

    submitButton.addEventListener(
        "click",
        submitQuiz
    );


    function submitQuiz() {

        if (
            userAnswers[currentQuestion] === null
        ) {

            message.textContent =
                "Please select an answer first.";

            return;

        }


        calculateScore();

        clearInterval(timerInterval);

        quizStarted = false;

        showResult();

    }


    // ==========================================
    // CALCULATE SCORE
    // ==========================================

    function calculateScore() {

        score = 0;


        questions.forEach(
            (q, index) => {

                if (
                    userAnswers[index] === q.answer
                ) {

                    score++;

                }

            }
        );

    }


    // ==========================================
    // SHOW RESULT
    // ==========================================

    function showResult() {

        quizScreen.style.display = "none";

        resultScreen.style.display = "block";


        const correct = score;

        const wrong =
            questions.length - score;

        const percent =
            Math.round(
                (score / questions.length) * 100
            );


        finalScore.textContent =
            `${score} / ${questions.length}`;


        correctAnswers.textContent =
            correct;


        wrongAnswers.textContent =
            wrong;


        percentage.textContent =
            `${percent}%`;


        // Result message

        if (percent === 100) {

            resultMessage.textContent =
                "Perfect score! Excellent work! 🎉";

        } else if (percent >= 80) {

            resultMessage.textContent =
                "Great job! You have excellent knowledge! 👏";

        } else if (percent >= 60) {

            resultMessage.textContent =
                "Good effort! Keep practicing! 👍";

        } else if (percent >= 40) {

            resultMessage.textContent =
                "Not bad! A little more practice will help. 📚";

        } else {

            resultMessage.textContent =
                "Keep learning and try again! 💪";

        }

    }


    // ==========================================
    // TIMER
    // ==========================================

    function startTimer() {

        clearInterval(timerInterval);


        timerInterval =
            setInterval(
                function() {

                    timeLeft--;

                    updateTimer();


                    if (timeLeft <= 0) {

                        clearInterval(
                            timerInterval
                        );

                        timeUp();

                    }

                },
                1000
            );

    }


    // ==========================================
    // UPDATE TIMER
    // ==========================================

    function updateTimer() {

        timer.textContent =
            `⏱️ ${timeLeft}`;

    }


    // ==========================================
    // TIME UP
    // ==========================================

    function timeUp() {

        calculateScore();

        quizStarted = false;

        showResult();

    }


    // ==========================================
    // RESTART QUIZ
    // ==========================================

    restartButton.addEventListener(
        "click",
        function() {

            clearInterval(timerInterval);

            startScreen.style.display =
                "block";

            quizScreen.style.display =
                "none";

            resultScreen.style.display =
                "none";

            timeLeft = 60;

            score = 0;

            currentQuestion = 0;

            userAnswers =
                new Array(questions.length)
                    .fill(null);

        }
    );


    // ==========================================
    // KEYBOARD SUPPORT
    // ==========================================

    document.addEventListener(
        "keydown",
        function(event) {

            if (!quizStarted) {
                return;
            }


            // Press 1, 2, 3, 4

            if (
                ["1", "2", "3", "4"]
                .includes(event.key)
            ) {

                const selected =
                    parseInt(event.key) - 1;

                selectAnswer(selected);

            }


            // Right arrow = next

            if (event.key === "ArrowRight") {

                nextButton.click();

            }


            // Left arrow = previous

            if (event.key === "ArrowLeft") {

                previousButton.click();

            }

        }
    );

</script>

</body>
</html>
